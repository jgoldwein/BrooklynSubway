[platformio]
default_envs = xiao-s3

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[env:brooklyn-s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1

; Manufactured PCB: ESP32-S3-WROOM-1U-N16R8
; 16 MB Quad-SPI flash + 8 MB Octal-SPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBROOKLYN_TARGET_PCB=1
    -DBROOKLYN_ALLOW_PHYSICAL_LED_OUTPUT=0

lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3

[env:xiao-s3]
platform = espressif32@7.1.3
board = seeed_xiao_esp32s3

; Travel/bench toolchain target only. Not electrically equivalent to the PCB.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBROOKLYN_TARGET_XIAO=1
    -DBROOKLYN_ALLOW_PHYSICAL_LED_OUTPUT=0
