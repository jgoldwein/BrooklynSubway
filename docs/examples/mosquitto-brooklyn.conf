# Illustrative Mosquitto configuration template only.
# Verify directives against the installed Mosquitto version before deployment.
# This exposes only the production MQTT/TLS listener; there is no port 1883.

listener 8884
allow_anonymous false
password_file /etc/mosquitto/brooklyn-passwd
acl_file /etc/mosquitto/brooklyn.acl

# The certificate SAN must include mqtt.goldwein.net.
certfile /etc/mosquitto/certs/mqtt.goldwein.net-fullchain.pem
keyfile /etc/mosquitto/certs/mqtt.goldwein.net-privkey.pem
tls_version tlsv1.2

max_connections 128
max_packet_size 8192
message_size_limit 4096
max_keepalive 120
retain_available true
set_tcp_nodelay true

persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300

log_dest syslog
log_type error
log_type warning
log_type notice
